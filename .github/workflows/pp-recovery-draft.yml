name: PP recovery draft regression checks

on:
  push:
    branches:
      - draft/pp-recovery-dossier-002
    paths:
      - "review_044_*.py"
      - "test_review_044_*.py"
      - "pp_recovery_strict_ci_runner.py"
      - "pp_recovery_ci_inventory.py"
      - "test_pp_recovery_ci_inventory.py"
      - "pp_recovery_ci_receipt.py"
      - "test_pp_recovery_ci_receipt.py"
      - "test_pp_recovery_strict_ci_runner.py"
      - ".github/workflows/pp-recovery-draft.yml"
  pull_request:
    paths:
      - "review_044_*.py"
      - "test_review_044_*.py"
      - "pp_recovery_strict_ci_runner.py"
      - "pp_recovery_ci_inventory.py"
      - "test_pp_recovery_ci_inventory.py"
      - "pp_recovery_ci_receipt.py"
      - "test_pp_recovery_ci_receipt.py"
      - "test_pp_recovery_strict_ci_runner.py"
      - ".github/workflows/pp-recovery-draft.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pp-recovery-draft-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery-security-regressions:
    name: Synthetic recovery security (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional signature-verification backend
        run: python -m pip install "cryptography>=43,<47"
      - name: Compile recovery modules and tests
        id: syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in sorted(Path(".").glob("review_044_*.py")):
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          for path in sorted(Path(".").glob("test_review_044_*.py")):
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          for name in ("pp_recovery_strict_ci_runner.py", "test_pp_recovery_strict_ci_runner.py", "pp_recovery_ci_inventory.py", "test_pp_recovery_ci_inventory.py", "pp_recovery_ci_receipt.py", "test_pp_recovery_ci_receipt.py"):
              ast.parse(Path(name).read_text(encoding="utf-8"), filename=name)
          print("Synthetic recovery source syntax: OK")
          PY
      - name: Verify fail-closed CI runner, inventory and receipt
        id: policy
        run: python -m unittest -v test_pp_recovery_strict_ci_runner test_pp_recovery_ci_inventory test_pp_recovery_ci_receipt
      - name: Run offline synthetic recovery regression suites
        id: regressions
        run: |
          python pp_recovery_strict_ci_runner.py
      - name: Confirm gate remains blocked
        id: boundary
        run: |
          python - <<'PY'
          from review_044_release_boundary_snapshot import review_boundary_snapshot
          from test_review_044_release_boundary_snapshot import encode, valid_report
          report = review_boundary_snapshot(encode(valid_report()))
          assert report["authorization"] == "HOLD"
          assert report["accessDecision"] == "DENY"
          assert report["issuance"] == "NOT_AUTHORIZED"
          assert report["deployment"] == "BLOCKED"
          print("Release boundary remains HOLD / DENY / NOT_AUTHORIZED / BLOCKED")
          PY
      - name: Write unsigned execution receipt
        if: ${{ always() }}
        env:
          PP_PYTHON_VERSION: ${{ matrix.python-version }}
          PP_SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
          PP_POLICY_OUTCOME: ${{ steps.policy.outcome }}
          PP_REGRESSIONS_OUTCOME: ${{ steps.regressions.outcome }}
          PP_BOUNDARY_OUTCOME: ${{ steps.boundary.outcome }}
        run: |
          python pp_recovery_ci_receipt.py \
            --output pp-recovery-ci-receipt.json \
            --syntax "${PP_SYNTAX_OUTCOME:-unknown}" \
            --policy "${PP_POLICY_OUTCOME:-unknown}" \
            --regressions "${PP_REGRESSIONS_OUTCOME:-unknown}" \
            --boundary "${PP_BOUNDARY_OUTCOME:-unknown}"
      - name: Upload unsigned execution receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pp-recovery-receipt-py${{ matrix.python-version }}
          path: pp-recovery-ci-receipt.json
          if-no-files-found: warn
          retention-days: 7
